[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "korg-pa800-factory-intelligence"
version = "0.1.0"
description = "KORG PA800 Factory Style MIDI Intelligence Layer"
requires-python = ">=3.11"
dependencies = [
    "mido>=1.2.10",
    "pytest>=7.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
