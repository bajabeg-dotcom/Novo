[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pa800-midi-enhancer"
version = "0.27.0"
description = "Safe Standard MIDI File inspection and optimization foundation for Korg Pa800 workflows"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "mido>=1.3.3",
]

[project.optional-dependencies]
dna = [
  "scipy>=1.18",
  "scikit-learn>=1.9",
  "music21>=10.5",
]
generator = [
  "torch>=2.13",
]

[project.scripts]
pa800-enhancer = "pa800_enhancer.cli:main"

[tool.setuptools.packages.find]
include = ["pa800_enhancer*"]

[tool.setuptools.package-data]
pa800_enhancer = ["templates/*.txt"]
