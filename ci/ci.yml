# Kopiraj u .github/workflows/ci.yml
#
# Napomena: Arena bot token nema `workflows` dozvolu, pa ovaj fajl ne moze
# biti pushovan direktno u .github/workflows/. Premjesti ga rucno:
#
#     mkdir -p .github/workflows && git mv ci/ci.yml .github/workflows/ci.yml
#     git commit -m "Enable CI" && git push

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Import check
        run: python -c "import pa800_enhancer; print(pa800_enhancer.__name__)"

      - name: CLI smoke
        run: python -m pa800_enhancer --help

      - name: Tests
        run: pytest --cov=pa800_enhancer --cov-report=term-missing

  build:
    name: Build wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
