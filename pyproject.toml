[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pa800-midi-enhancer"
version = "0.28.0.dev0"
description = "Safe Standard MIDI File inspection and optimization foundation for Korg Pa800 workflows"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "mido>=1.3.3",
]

[project.optional-dependencies]
dna = [
  "scipy>=1.18",
  "scikit-learn>=1.9",
  "music21>=10.5",
]
generator = [
  "torch>=2.13",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[project.scripts]
pa800-enhancer = "pa800_enhancer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pa800_enhancer*"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
pa800_enhancer = ["templates/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
markers = [
  "corpus: requires the external DNA corpus",
  "slow: long-running test",
]

[tool.coverage.run]
source = ["pa800_enhancer"]
branch = true
